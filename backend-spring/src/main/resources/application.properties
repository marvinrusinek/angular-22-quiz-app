spring.application.name=quiz-backend

# Separate from the Node reference backend's default port (3000) so both can
# run side by side during the migration. Not the Node port by coincidence
# avoided: Slice 1 explicitly must not disturb the running Node backend.
#
# ${PORT:8080}: Render (and most PaaS hosts) inject their own PORT at
# runtime and expect the process to bind to it; 8080 remains the local-dev
# default when PORT is unset.
server.port=${PORT:8080}

# Actuator is included for later production diagnostics but intentionally
# left at Spring Boot's own conservative defaults here: only /actuator/health
# is exposed, with show-details=never, so no internal state is exposed by
# default. The PUBLIC application contract is /api/health (HealthController),
# not /actuator/health, matching the Node reference's own single health route.

# ---------------------------------------------------------------------------
# Slice 2 — datasource configuration.
#
# Sourced ENTIRELY from environment variables. No value below is a secret;
# these are Spring Boot's own conventional property names, populated from
# SPRING_DATASOURCE_* env vars that must be set in the shell before starting
# this app — never hard-coded, never committed. There is no default here and
# no fallback: an unset SPRING_DATASOURCE_URL means the app fails to start
# with a clear "DataSource 'url' attribute is not specified" error rather
# than silently running without a database (fail-closed, matching the Node
# reference's own DATABASE_URL requirement in backend/src/db/database.ts).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── SSL: translating the Node reference's TLS posture to JDBC ──────────────
#
# The Node reference (backend/src/db/database.ts) connects with
# `ssl: { rejectUnauthorized: false }` — TLS is REQUIRED, but Neon's server
# certificate is not validated against a root present in the container image
# (Node's own comment explains why). The connection is still encrypted; only
# certificate-chain verification is skipped.
#
# The faithful JDBC/pgJDBC equivalent of that SAME posture is `sslmode=require`
# (encrypted, no certificate validation) — append it to the SPRING_DATASOURCE_URL
# value itself, e.g.:
#   jdbc:postgresql://<host>/<database>?sslmode=require
# This is NOT sslmode=disable (which would mean unencrypted) and NOT
# sslmode=verify-full (which would add certificate validation Node does not
# perform either) — it is the same security posture Node already has today,
# expressed in JDBC's connection-string vocabulary instead of node-postgres's.

# ── PgBouncer (Neon's pooled endpoint) + Hibernate prepared statements ─────
#
# Node's own .env.example requires the POOLED Neon connection string (host
# contains "-pooler"), which is fronted by PgBouncer in transaction-pooling
# mode. Hibernate/pgJDBC's server-side prepared-statement cache can collide
# with that (a statement prepared against one pooled backend connection is
# not guaranteed to exist on the next one a later query lands on), so
# prepared-statement caching is disabled explicitly here rather than left to
# surface as an intermittent production failure.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ── Hibernate schema safety — the hard gate ─────────────────────────────────
#
# The existing PostgreSQL schema (backend/src/db/migrations/) is canonical.
# Hibernate validates entity mappings against it at startup and MUST NEVER
# create, drop or alter anything. `validate` is the strictest non-mutating
# option Spring Boot 4.1.1 / Hibernate 7 expose for this — verified against
# the actual resolved Hibernate version rather than assumed.
spring.jpa.hibernate.ddl-auto=validate

# Every DB access happens inside an explicit @Transactional(readOnly = true)
# service method (see QuizService) — no lazy-loading is expected to happen
# inside a controller or view layer, so open-in-view is disabled rather than
# left at Spring Boot's default `true` (which exists precisely to paper over
# that pattern, and logs a startup warning encouraging it be turned off).
spring.jpa.open-in-view=false
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Slice 6B — Topic Quiz HMAC receipt signing secret.
#
# Sourced ENTIRELY from the TOPIC_QUIZ_RECEIPT_SECRET environment variable.
# No default here: TopicQuizReceiptSecret (com.quizbackend.quiz.receipt)
# refuses to construct — and therefore the whole application refuses to
# start — when this resolves to an empty string, exactly the same
# fail-closed posture already chosen above for SPRING_DATASOURCE_URL.
#
# This is a DELIBERATE difference from the Node reference's own
# `parseReceiptSecret` (backend/src/config.ts), which falls back to a
# clearly-labelled development secret outside production. This migration
# has no established "production" flag (Slice 2 chose to always require
# SPRING_DATASOURCE_URL rather than introduce one), so this follows that
# same precedent instead of inventing a new environment concept — see
# TopicQuizReceiptSecret's javadoc for the full reasoning. Only the "test"
# Spring profile overrides this, with a clearly-synthetic value (see
# application-test.properties) — every other profile requires the real
# environment variable.
topicquiz.receipt-secret=${TOPIC_QUIZ_RECEIPT_SECRET:}
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Slice 6C — CORS allow-list.
#
# Sourced from the SAME environment variable name Node uses (ALLOWED_ORIGINS,
# comma-separated), for operational consistency between the two backends.
# Unset resolves to an EMPTY list (no extra static origins beyond the
# StackBlitz preview matcher — see AllowedOrigins/StackBlitzPreviewOrigin in
# com.quizbackend.web.cors) rather than Node's own dev-mode default
# (http://localhost:4200, http://127.0.0.1:4200): this migration has no
# established "production" flag to gate that default on (see Slice 2's
# SPRING_DATASOURCE_URL and Slice 6B's TOPIC_QUIZ_RECEIPT_SECRET for the
# same precedent), so an unset value stays maximally restrictive in every
# environment rather than being permissive by default anywhere.
cors.allowed-origins=${ALLOWED_ORIGINS:}
# ---------------------------------------------------------------------------

@if (achievements().length > 0) {
  <section
    class="achievement-unlocked"
    role="status"
    aria-live="polite"
  >
    <h2 class="achievement-unlocked__heading">
      <span
        class="achievement-unlocked__icon"
        aria-hidden="true"
      >
        🏆
      </span>
      <ng-container i18n>Achievement Unlocked</ng-container>
    </h2>
    <!-- The names and descriptions stay exposed to assistive technology (no aria-hidden): this card announces WHICH
         achievement was just unlocked, alongside the always-visible Achievements catalog below. -->
    <ul class="achievement-unlocked__list">
      @for (achievement of achievements(); track achievement.id) {
        <li class="achievement-unlocked__item">
          <span class="achievement-unlocked__name">
            @if (achievement.icon) {
              <span
                class="achievement-unlocked__emoji"
                aria-hidden="true"
              >
                {{ achievement.icon }}
              </span>
            }
            {{ achievement.name }}
          </span>
          <span class="achievement-unlocked__desc">{{ achievement.description }}</span>
        </li>
      }
    </ul>
  </section>
}

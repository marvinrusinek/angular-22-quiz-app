spring.application.name=quiz-backend

# Separate from the Node reference backend's default port (3000) so both can
# run side by side during the migration. Not the Node port by coincidence
# avoided: Slice 1 explicitly must not disturb the running Node backend.
server.port=8080

# Actuator is included for later production diagnostics but intentionally
# left at Spring Boot's own conservative defaults here: only /actuator/health
# is exposed, with show-details=never, so no internal state is exposed by
# default. The PUBLIC application contract is /api/health (HealthController),
# not /actuator/health, matching the Node reference's own single health route.

# ---------------------------------------------------------------------------
# Future datasource configuration (Slice 2 — NOT wired yet).
#
# The Node reference backend reads a single DATABASE_URL env var pointing at
# the existing Neon Postgres database (see backend/src/config.ts) and never
# stores credentials in a committed file. Slice 2 will follow the same
# pattern via Spring Boot's standard environment-variable property override:
#
#   spring.datasource.url=${SPRING_DATASOURCE_URL}
#   spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#   spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#
# and Hibernate's DDL policy will be validation-only:
#
#   spring.jpa.hibernate.ddl-auto=validate
#
# The existing PostgreSQL schema is canonical (see the migration audit,
# section 4/15) — Hibernate must never create or redesign it. No property
# names above are secrets; no values are set here.
# ---------------------------------------------------------------------------

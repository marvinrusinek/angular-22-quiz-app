<ng-container class="timer-container">
  <div class="timer-menu-container">
    <button
      type="button"
      class="scoreboard-control"
      [matMenuTriggerFor]="timerMenu"
      [attr.aria-label]="timerAccessibleLabel()"
    >
      <span class="scoreboard-control__label">
        <span class="timer-menu-button-text leader" i18n>Timer<span aria-hidden="true">&#x25BC;</span></span>
      </span>
      <span class="scoreboard-timer" aria-hidden="true">
        <span class="scoreboard" [class.low-time]="isLowTime()">{{ displayClock() }}</span>
      </span>
    </button>
    <mat-menu #timerMenu="matMenu">
      <button
        mat-menu-item
        (click)="setTimerType(timerType.Countdown)"
        aria-label="Set to Countdown"
        i18n-aria-label
        i18n
      >
        Countdown
      </button>
      <button
        mat-menu-item
        (click)="setTimerType(timerType.Stopwatch)"
        aria-label="Set to Stopwatch"
        i18n-aria-label
        i18n
      >
        Stopwatch
      </button>
    </mat-menu>
  </div>
</ng-container>

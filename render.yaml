# Render Blueprint for the Interview API.
#
# Import this from the Render dashboard (New → Blueprint) and it creates the
# service with the right settings. Host-agnostic alternatives (Fly.io, Railway)
# work from the same backend/Dockerfile — see backend/DEPLOY.md.
#
# Runs on the FREE tier against a managed Postgres (Neon free tier) supplied
# through DATABASE_URL. Session state no longer lives on the container's disk.
# What that changes:
#
#   * A submitted interview REMAINS readable after a restart or a redeploy.
#     The database is a separate service now, so wiping the container's
#     filesystem no longer takes the sessions with it.
#   * A per-question review is still lost when the BROWSER TAB closes. The
#     session token lives in sessionStorage by design, and without it the
#     server will not release review data. Durable storage fixes the server
#     half of this, not the credential half.
#   * The user never loses their score either way. Interview History is
#     client-side and already sanitized, so the attempt, percentage and
#     per-topic breakdown survive regardless.
#   * An interview in progress is safe: answering sends traffic, and a service
#     with traffic does not idle out. Assessments are 15 minutes anyway.
#   * The first request after an idle period still pays a cold start of roughly
#     30-60 seconds, and a free-tier Postgres may need to wake as well. Starting
#     an interview can feel slow, or time out and show the retry state.

services:
  - type: web
    name: interview-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # The quiz bank is PostgreSQL-only (Stage 15) — the Dockerfile copies no
    # quiz data file. dockerContext is still the backend directory so the
    # build only sees backend sources, not the whole repo.
    dockerContext: ./backend
    plan: free
    # Matches the Neon project's region (AWS us-west-2). Keep these two
    # together: every interview action issues several queries, and a
    # cross-region hop adds a round trip to each one.
    region: oregon
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render supplies PORT; the app reads it. Do not hard-code it.

      # EXACT origins allowed to call this API. The config rejects a wildcard
      # outright and requires https in production, so this cannot be loosened
      # by accident. Add your local origin only if you want to point a dev
      # frontend at the hosted API.
      #
      # The second entry is the StackBlitz preview. Its host contains a SESSION
      # HASH that StackBlitz regenerates, so this will stop matching eventually
      # and the preview will fail CORS again — replace it with the new origin
      # when that happens, or ask for suffix matching, which the origin check
      # deliberately does not do today.
      - key: ALLOWED_ORIGINS
        value: https://marvinrusinek.github.io,https://angular22quizapp-uyfq--4200--87cf54cd.local-credentialless.webcontainer.io

      # The Postgres connection string. Set it in the Render dashboard, NOT
      # here — it carries credentials and this file is committed. `sync: false`
      # makes Render prompt for the value and keeps it out of the blueprint.
      #
      # Use Neon's POOLED connection string (the host containing "-pooler").
      # A free service that idles down and wakes repeatedly opens connections
      # faster than a direct endpoint's limit comfortably allows.
      #
      # The server REQUIRES this in production and refuses to boot without it,
      # so a missing value fails visibly at startup rather than at the first
      # interview.
      - key: DATABASE_URL
        sync: false

  # Spring Boot migration target for the same Interview API. Runs ALONGSIDE
  # interview-api (Node), not in place of it — Node remains the production
  # backend and rollback target until Angular's production API URL is
  # deliberately switched over in a separate, later step. autoDeploy is OFF:
  # this service is created and later promoted only by an explicit operator
  # action in the Render dashboard, never by a push to main.
  - type: web
    name: interview-api-spring
    runtime: docker
    dockerfilePath: ./backend-spring/Dockerfile
    # Same monorepo pattern as interview-api above: the build context is
    # scoped to backend-spring/ only, not the whole repo.
    dockerContext: ./backend-spring
    plan: free
    # Same region as interview-api AND the Neon project itself — both
    # services reach the SAME Neon database.
    region: oregon
    autoDeploy: false
    # /actuator/health/readiness (Spring Boot Actuator), not /api/health:
    # only the readiness group actually pings the DataSource, so Render only
    # marks this service healthy when Neon is genuinely reachable — see the
    # deployment plan for why /api/health (liveness-only, Node parity) is
    # the wrong choice here.
    healthCheckPath: /actuator/health/readiness

    envVars:
      # Render supplies PORT; server.port=${PORT:8080} in application.properties
      # reads it. Do not hard-code it here.

      # EXACT origin allowed to call this API — scheme + host only, no path
      # (an HTTP Origin header never carries a path, so NOT
      # https://marvinrusinek.github.io/angular-22-quiz-app/). Spring's CORS
      # filter rejects a wildcard outright, the same fail-closed posture as
      # Node's ALLOWED_ORIGINS above.
      #
      # The StackBlitz preview origin does NOT need an entry here: unlike
      # Node (which requires the literal, session-hash-bearing origin kept
      # in sync in render.yaml above, and goes stale when StackBlitz
      # regenerates it), Spring has its own built-in StackBlitz
      # preview-origin matcher (com.quizbackend.web.cors.StackBlitzPreviewOrigin)
      # that recognizes the pattern regardless of session hash.
      - key: ALLOWED_ORIGINS
        value: https://marvinrusinek.github.io

      # The SAME Neon database interview-api already uses. Set all three in
      # the Render dashboard, NOT here — never copy credentials into this
      # committed file. sync: false makes Render prompt for each value.
      #
      # SPRING_DATASOURCE_URL is a CLEAN JDBC URL only — scheme, host, port,
      # database and query params, with NO embedded username/password (unlike
      # Node's single DATABASE_URL above, which embeds both):
      #   jdbc:postgresql://<pooled-host>/<database>?sslmode=require
      # Credentials go ONLY in SPRING_DATASOURCE_USERNAME and
      # SPRING_DATASOURCE_PASSWORD below, kept separate from the URL itself —
      # Spring Boot's own datasource properties are structured this way, and
      # DataSourceProperties/Hikari would reject or mishandle a URL carrying
      # embedded credentials in JDBC form. Use the SAME pooled Neon host
      # ("-pooler") as DATABASE_URL above, with ?sslmode=require appended (see
      # application.properties' SSL comment for why). Spring has no
      # migration-authoring capability of its own (ddl-auto=validate only) —
      # this service must only ever be pointed at a Neon database whose
      # schema Node's migrations have already brought fully up to date.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # HMAC signing secret for Topic Quiz attempt/question receipts. MUST be
      # the SAME VALUE as Node's TOPIC_QUIZ_RECEIPT_SECRET in the interview-api
      # service above — NOT a distinct per-service secret. A receipt issued by
      # one runtime must verify on the other during cutover and, if needed,
      # rollback; a mismatched secret would make every in-flight Topic Quiz
      # receipt invalid the moment traffic crossed runtimes. Still at least 32
      # characters (the app refuses to start otherwise) and still never this
      # file — copy the exact same value Node's dashboard entry already holds.
      - key: TOPIC_QUIZ_RECEIPT_SECRET
        sync: false

<div class="quiz-sort">
  <!-- Difficulty: the visible word carries the meaning, the arrow only shows the
       direction. The accessible name states the applied state; the tooltip says
       what activating it does. Never disabled, so keyboard focus is kept. -->
  <button
    type="button"
    class="sort-btn sort-btn--difficulty"
    (click)="toggleDifficulty()"
    [attr.aria-label]="difficultyLabel()"
    [matTooltip]="difficultyHint()"
  >
    <span class="sort-btn__text" i18n>Difficulty</span>
    <mat-icon class="sort-btn__icon" aria-hidden="true">{{
      difficultyDirection() === 'asc' ? 'arrow_upward' : 'arrow_downward'
    }}</mat-icon>
  </button>

  <button
    type="button"
    class="sort-btn sort-btn--alpha"
    (click)="toggleAlpha()"
    [attr.aria-label]="alphaLabel()"
    [matTooltip]="alphaHint()"
  >
    @if (alphaDirection() === 'az') {
      <span class="sort-btn__text" i18n>A&ndash;Z</span>
    } @else {
      <span class="sort-btn__text" i18n>Z&ndash;A</span>
    }
  </button>
</div>

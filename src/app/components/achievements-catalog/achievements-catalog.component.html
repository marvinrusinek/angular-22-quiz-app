@if (total() > 0) {
  <section class="achievements-catalog">
    <!-- Always-visible section. The heading's text is the earned count ("Achievements, N of M"); there is no disclosure
         button, no aria-expanded and no chevron, so nothing here is interactive. -->
    <h3 class="achievements-catalog__heading">
      <span
        class="achievements-catalog__icon"
        aria-hidden="true"
      >
        🏆
      </span>
      <span class="achievements-catalog__title">{{ toggleLabel() }}</span>
    </h3>

      <!-- role="none" on the <ul>: no list semantics, so no item positions ("2 of 6") are announced. Each row is
           ONE group: its icon, name, description and status are hidden from assistive technology and the group
           exposes a single text node, "<name>. <description>. <Earned|Locked>." (see IntroExposedTextDirective), so
           Narrator reads the row once, as a group, never as a graphic. Nothing interactive lives inside a row. -->
      <ul
        id="achievements-catalog-list"
        class="achievements-catalog__list"
        role="none"
      >
        @for (achievement of achievements(); track achievement.id) {
          <li
            class="achievements-catalog__item"
            [class.is-earned]="achievement.earned"
            [class.is-locked]="!achievement.earned"
          >
            <div class="achievements-catalog__row" role="group">
              <div class="achievements-catalog__visible" data-intro-visible aria-hidden="true">
                <span class="achievements-catalog__state-icon">
                  {{ achievement.earned ? '✓' : '🔒' }}
                </span>
                <span class="achievements-catalog__body">
                  <span class="achievements-catalog__name">
                    @if (achievement.icon) {
                      <span class="achievements-catalog__emoji">
                        {{ achievement.icon }}
                      </span>
                    }
                    {{ achievement.name }}
                  </span>
                  <!-- The trailing no-break space is kept for the visible layout only: it affects where the last
                       word wraps in a narrow row. The exposed text no longer depends on it. -->
                  <span class="achievements-catalog__desc" data-intro-font-ref>{{ achievement.description }}&nbsp;</span>
                </span>
                <span class="achievements-catalog__badge">{{ statusLabel(achievement) }}</span>
              </div>
              <span [appIntroExposedText]="rowLabel(achievement)" exposedTextMode="cover" exposedTextBox="group"></span>
            </div>
          </li>
        }
      </ul>
  </section>
}

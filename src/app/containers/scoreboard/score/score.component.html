<div class="score-menu-container">
  <button
    type="button"
    class="scoreboard-control"
    [matMenuTriggerFor]="displayScoreMenu"
    [attr.aria-label]="scoreAccessibleLabel()"
  >
    <span class="scoreboard-control__label">
      <span class="leader" i18n>Score<span aria-hidden="true">&#x25BC;</span></span>
    </span>
    <span class="scoreboard-score" aria-hidden="true">
      <span class="scoreboard">{{ displayedScore() }}</span>
    </span>
  </button>
  <mat-menu #displayScoreMenu="matMenu" xPosition="before">
    <button
      mat-menu-item
      name="numerical"
      aria-label="Display numerical score"
      i18n-aria-label
      (click)="toggleScoreDisplay('numerical')"
      i18n="@@numerical"
    >
      Numerical
    </button>
    <button
      mat-menu-item
      name="percentage"
      aria-label="Display percentage score"
      i18n-aria-label
      (click)="toggleScoreDisplay('percentage')"
      i18n="@@percentage"
    >
      Percentage
    </button>
  </mat-menu>
</div>

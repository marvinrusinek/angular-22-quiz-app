<!-- Circular Score Ring: one group. The ring and the value are hidden from AT as one unit and
     the group exposes ONE text node, "<N>% Score" (see IntroExposedTextDirective), so Narrator
     reads the value and label once, as a group, never as a graphic. -->
<div class="circular-score" role="group">
  <div class="ring-visible" data-intro-visible aria-hidden="true">
    <svg
      class="score-ring"
      viewBox="0 0 140 140"
    >
      <circle
        class="ring-bg"
        cx="70"
        cy="70"
        r="60"
      />
      <circle
        class="ring-progress"
        [class.ring-excellent]="feedbackLevel() === 'excellent'"
        [class.ring-good]="feedbackLevel() === 'good'"
        [class.ring-poor]="feedbackLevel() === 'poor'"
        cx="70"
        cy="70"
        r="60"
        [style.stroke-dasharray]="377"
        [style.stroke-dashoffset]="377 - 377 * (percentage() / 100)"
      />
    </svg>
    <div class="score-value">
      <div class="percentage">{{ percentage() }}%</div>
      <div class="label" data-intro-font-ref>Score</div>
    </div>
  </div>
  <span [appIntroExposedText]="circleAria()" exposedTextMode="cover" exposedTextBox="group"></span>
</div>

<!-- Score Breakdown: one group, one exposed text item. The visible rows are
     hidden from AT; the group exposes ONE text node sized to them (see
     IntroExposedTextDirective), so Narrator reads "N Correct, N Incorrect,
     N Timed Out" once as a group, draws one box, and moves on. -->
<div class="score-breakdown" role="group">
  <div class="score-breakdown-visible" data-intro-visible aria-hidden="true">
    <span class="breakdown-item correct">✔ {{ correctText() }}</span>
    <span class="breakdown-item incorrect">✖ {{ incorrectText() }}</span>
    <span class="breakdown-item timed-out">⏱ {{ timedOutText() }}</span>
  </div>
  <span [appIntroExposedText]="breakdownExposedText()" exposedTextMode="justify"></span>
</div>

<!-- Star Rating -->
<div class="star-rating">
  <span
    class="star-icons"
    role="img"
    [attr.aria-label]="starsAria()"
  >
    @for (star of [1, 2, 3, 4, 5]; track star) {
      <span
        class="star"
        [class.filled]="star <= starCount()"
        [class.empty]="star > starCount()"
      >
        ⭐
      </span>
    }
  </span>
</div>

<!-- Achievement Badge: one group for every level. The icon and the text are hidden
     from AT as one unit and the group exposes ONE text node, the badge text (see
     IntroExposedTextDirective), so Narrator reads "Keep Practicing!" once, as a
     group, never as a graphic, and never the emoji on its own. -->
<div
  class="achievement-badge"
  role="group"
  [class.excellent]="feedbackLevel() === 'excellent'"
  [class.good]="feedbackLevel() === 'good'"
  [class.needs-work]="feedbackLevel() === 'poor'"
>
  <div class="badge-visible" data-intro-visible aria-hidden="true">
    <span class="badge-icon">{{ badgeIcon() }}</span>
    <span class="badge-text" data-intro-font-ref>{{ badgeText() }}</span>
  </div>
  <span [appIntroExposedText]="badgeText()" exposedTextMode="cover" exposedTextBox="group" exposedSingleRow></span>
</div>

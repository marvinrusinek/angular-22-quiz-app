# Test profile. Activate explicitly with -Dspring.profiles.active=test (or
# @ActiveProfiles("test") on a test class); nothing activates it implicitly.
#
# Slice 2 added Spring Data JPA + the PostgreSQL driver to the main
# dependencies, so ANY test that boots a full Spring context now triggers
# datasource/JPA autoconfiguration unless something stops it. This project's
# ordinary `mvnw.cmd test` run must NEVER need a real Neon password (see the
# Slice 2 report, "Test isolation from production credentials") — real
# connectivity is proven separately, by starting the packaged app with real
# SPRING_DATASOURCE_* env vars set, exactly like Slice 1's /api/health smoke
# test on port 8080.
#
# So under this profile, datasource/JPA autoconfiguration is excluded
# entirely. Every @SpringBootTest class in this project runs under
# @ActiveProfiles("test") and therefore never needs a DataSource bean; a test
# that exercises quiz behavior mocks QuizService/QuizRepository instead of
# hitting a real database. Class names verified against the actual Spring
# Boot 4.1.1 jars (spring-boot-jdbc-4.1.1.jar, spring-boot-hibernate-4.1.1.jar,
# spring-boot-data-jpa-4.1.1.jar) — Boot 4 moved these out of the
# org.springframework.boot.autoconfigure.{jdbc,orm.jpa} packages Boot 3 used.
spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

# Slice 6B — TopicQuizReceiptSecret (com.quizbackend.quiz.receipt) has no
# autoconfiguration to exclude (it is a plain @Component, not a DataSource),
# so it needs an explicit override here instead: a CLEARLY SYNTHETIC value,
# never a real production secret, purely so @SpringBootTest classes can
# construct the application context without an environment variable — this
# value is never used to reach real infrastructure. >=32 chars to satisfy
# TopicQuizReceiptSecret's own minimum-length check.
topicquiz.receipt-secret=test-only-synthetic-topic-quiz-receipt-secret-000

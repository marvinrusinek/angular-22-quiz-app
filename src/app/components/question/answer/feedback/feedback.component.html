<section class="message" [class.feedback-inline]="stylePreset() === 'inline'">
  <!--
    NOT a live region (no role="status"/aria-live here): this section is
    recreated at a new option-anchor on every feedback change (see
    shared-option.component.html's shouldShowFeedbackAfter gate, kept as-is
    for correct VISUAL positioning below the relevant option), so a screen
    reader would see a freshly-inserted, already-populated subtree rather
    than a mutation on an element it has already registered — which most
    screen readers do not announce (confirmed live: Narrator read this text
    only on manual navigation to it, never automatically). The ACTUAL
    announcement now comes from messageAnnounced (see the .ts file), read by
    a single persistent, visually-hidden status region in
    SharedOptionComponent that is never destroyed. Keeping a second live
    region here would announce the same text twice.

    NOTHING RENDERS UNTIL THERE IS SOMETHING TO SAY.

    `showFeedback` alone was enough to render, and the icon below is an
    if/else — so it ALWAYS produced one. While `/check` is in flight the class
    and message are deliberately empty (a check is not a verdict), which showed
    a lone sad face for the length of the round trip, then the border and text
    arriving after it.

    Gating on the MESSAGE renders the box once, complete: `updateFeedback()`
    sets the message and the class together in one pass, so icon, border and
    text land in the same change-detection cycle. Bank-sourced quizzes decide
    synchronously, so nothing changes for them.
  -->
  @if (feedbackConfig()?.showFeedback && displayMessage()) {
    <div class="feedback-message" [ngClass]="feedbackMessageClass()">
      @if (isSelectedOptionCorrect()) {
        <mat-icon class="material-icons" aria-label="Correct answer" i18n-aria-label> sentiment_very_satisfied </mat-icon>
      } @else {
        <mat-icon class="material-icons wrong-icon" aria-label="Wrong answer" i18n-aria-label>
          sentiment_very_dissatisfied
        </mat-icon>
      }
      <span>{{ displayMessage() }}</span>
    </div>
  }
</section>
